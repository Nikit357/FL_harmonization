apiVersion: v1
kind: Pod
metadata:
  name: fl-batch-correction
  namespace: ${K8S_NAMESPACE}
spec:
  restartPolicy: Never
  shareProcessNamespace: true
  containers:
  - name: worker
    image: python:3.11
    resources:
      requests:
        cpu: "8"
        memory: "16Gi"
      limits:
        cpu: "8"
        memory: "16Gi"
    volumeMounts:
    - name: work
      mountPath: /workspace
  volumes:
  - name: work
    persistentVolumeClaim:
      claimName: fl-workspace
  tolerations:
    - key: node-group
      operator: Equal
      value: ${K8S_NODE_GROUP}
      effect: NoSchedule
  nodeSelector:
    karpenter.k8s.aws/instance-family: c6a