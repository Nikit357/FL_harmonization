---
# The SSH public key lives in a Secret, created once out of band and never committed:
#
#   kubectl create secret generic ssh-pubkey \
#       --from-file=authorized_keys=$HOME/.ssh/id_ed25519.pub \
#       --namespace ${K8S_NAMESPACE}
#
# It is mounted at /etc/ssh-init exactly as the previous ConfigMap was, so the startup
# script is unchanged. Keeping the key out of this file removes a personal identifier
# from the repository and lets anyone on the team apply the manifest with their own key.
---
# Python dependency file -- keep in sync with harmonization-metrics-calculation/requirements.txt
apiVersion: v1
kind: ConfigMap
metadata:
  name: fl-metrics-deps
  namespace: ${K8S_NAMESPACE}
data:
  requirements.txt: |
    boto3>=1.28.17
    botocore>=1.31.17
    pandas>=2.0
    numpy>=1.24
    scikit-learn>=1.3
    scipy>=1.9
    umap-learn>=0.5
    statsmodels>=0.14
    rpy2>=3.5.5
    psutil>=5.9
    awscli>=1.29
    openpyxl>=3.1
    xlrd>=2.0.1

---
apiVersion: v1
kind: Pod
metadata:
  name: fl-metrics
  namespace: ${K8S_NAMESPACE}
  labels:
    app: fl-metrics
spec:
  restartPolicy: OnFailure
  shareProcessNamespace: true

  containers:
  - name: worker
    image: ubuntu:24.04
    imagePullPolicy: IfNotPresent

    command: ["bash", "-c"]
    args:
      - |
        # -- 1. SSH (done first so you can connect and monitor the rest) --
        apt-get update -qq
        apt-get install -y -qq openssh-server rsync curl wget gnupg ca-certificates tmux htop
        mkdir -p /root/.ssh && chmod 700 /root/.ssh
        cp /etc/ssh-init/authorized_keys /root/.ssh/authorized_keys
        chmod 600 /root/.ssh/authorized_keys
        ssh-keygen -A
        mkdir -p /run/sshd
        echo 'PermitRootLogin yes' >> /etc/ssh/sshd_config
        echo 'PubkeyAuthentication yes' >> /etc/ssh/sshd_config
        echo 'PasswordAuthentication no' >> /etc/ssh/sshd_config
        /usr/sbin/sshd -D &
        echo "[startup] SSH ready - port-forward and connect now to watch progress"

        # -- 2. System libraries for Python and R --
        apt-get install -y -qq build-essential gfortran libcurl4-openssl-dev libssl-dev libxml2-dev libhdf5-dev libblas-dev liblapack-dev libuv1-dev python3 python3-pip python3-dev python-is-python3 software-properties-common cmake
        echo "[startup] System libraries installed"

        # -- 3. R 4.5 from CRAN noble-cran40 repo --
        wget -qO- https://cloud.r-project.org/bin/linux/ubuntu/marutter_pubkey.asc | gpg --dearmor -o /usr/share/keyrings/r-project.gpg
        echo "deb [signed-by=/usr/share/keyrings/r-project.gpg] https://cloud.r-project.org/bin/linux/ubuntu noble-cran40/" > /etc/apt/sources.list.d/r-project.list
        apt-get update -qq
        apt-get install -y r-base r-base-dev
        echo "[startup] R installed"
        echo 'export R_HOME=/usr/lib/R' >> /root/.bashrc
        echo 'export R_HOME=/usr/lib/R' >> /root/.profile

        # -- 4. Python packages --
        pip3 install --break-system-packages --no-cache-dir -r /etc/fl-metrics-deps/requirements.txt
        echo "[startup] Python packages installed"

        # -- 5. R packages --
        echo 'options(repos = c(CRAN = "https://cloud.r-project.org"), Ncpus = parallel::detectCores(), install.packages.ask = FALSE)' > /root/.Rprofile
        echo "[startup] Installing R packages..."
        Rscript --no-save --no-restore -e "if (!requireNamespace('BiocManager', quietly=TRUE)) install.packages('BiocManager')"
        Rscript --no-save --no-restore -e "BiocManager::install(version='3.22', ask=FALSE, update=FALSE)"
        Rscript --no-save --no-restore -e "install.packages('remotes', dependencies=TRUE)"
        Rscript --no-save --no-restore -e "BiocManager::install(c('variancePartition', 'BiocParallel'), ask=FALSE)" && echo "[startup] variancePartition OK"
        Rscript --no-save --no-restore -e "library(variancePartition); cat('[startup] variancePartition verified OK\n')" \
            || echo "[startup] WARNING: variancePartition verification failed - check logs above"
        echo "[startup] R packages installed"

        # -- 6. Working directory --
        mkdir -p /app/harmonization-metrics-calculation
        echo 'cd /app/harmonization-metrics-calculation' >> /root/.bashrc
        echo "[startup] Metrics environment ready. Sync scripts with rsync and run."

        sleep infinity

    ports:
      - containerPort: 22
        protocol: TCP
        name: ssh

    env:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    # One BLAS thread per worker. The metrics dispatcher runs many worker subprocesses
    # in parallel; unpinned BLAS threads oversubscribe the node and cost more than the
    # extra parallelism gains.
    - name: OMP_NUM_THREADS
      value: "1"
    - name: OPENBLAS_NUM_THREADS
      value: "1"
    - name: MKL_NUM_THREADS
      value: "1"

    resources:
      requests:
        cpu: "32"
        memory: "64Gi"
      limits:
        cpu: "32"
        memory: "64Gi"

    volumeMounts:
    - name: work
      mountPath: /workspace
    - name: aws-credentials
      mountPath: /root/.aws
      readOnly: true
    - name: dshm
      mountPath: /dev/shm
    - name: ssh-pubkey
      mountPath: /etc/ssh-init
    - name: fl-metrics-deps
      mountPath: /etc/fl-metrics-deps

  volumes:
  - name: work
    persistentVolumeClaim:
      claimName: fl-workspace
  - name: aws-credentials
    secret:
      secretName: aws-credentials
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 4Gi
  - name: ssh-pubkey
    secret:
      secretName: ssh-pubkey
      defaultMode: 0400
  - name: fl-metrics-deps
    configMap:
      name: fl-metrics-deps

  tolerations:
    - key: node-group
      operator: Equal
      value: ${K8S_NODE_GROUP}
      effect: NoSchedule

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-group
                operator: In
                values:
                  - ${K8S_NODE_GROUP}
  nodeSelector:
    karpenter.k8s.aws/instance-family: c6a
